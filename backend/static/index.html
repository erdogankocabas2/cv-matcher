<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Matcher - AI Destekli CV Uygunluk Analizörü</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Supabase JS SDK CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Babel CDN (JSX compiler) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#4f46e5', // indigo-600
              hover: '#4338ca',   // indigo-700
              light: '#e0e7ff',   // indigo-100
            }
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    .gradient-bg {
      background: radial-gradient(circle at 50% 50%, rgba(79, 70, 229, 0.04) 0%, rgba(255, 255, 255, 0) 100%);
    }
    .blur-overlay {
      backdrop-filter: blur(8px);
      background: linear-gradient(180deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.95) 40%, rgba(255,255,255,1) 100%);
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.4s ease-out forwards;
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans antialiased gradient-bg">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- SVG Icons ---
    const IconUpload = () => (
      <svg className="w-12 h-12 mb-3 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
      </svg>
    );

    const IconFileText = ({ className = "w-5 h-5 text-indigo-600" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
      </svg>
    );

    const IconX = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const IconLock = () => (
      <svg className="w-5 h-5 text-indigo-650" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
      </svg>
    );

    const IconSparkles = () => (
      <svg className="w-5 h-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9.813 15.904L9 21l-.813-5.096L3 15l5.096-.813L9 9l.813 5.096L15 15l-5.187.904zM18 10.5l-.563 3.063L14.375 14l3.062.563.563 3.062.563-3.062L21.625 14l-3.062-.563-.563-3.063z" />
      </svg>
    );

    const IconCheck = () => (
      <svg className="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" />
      </svg>
    );

    const IconPlus = () => (
      <svg className="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    );

    const IconChevronRight = () => (
      <svg className="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
        <path strokeLinecap="round" strokeLinejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    );

    const IconArrowRight = () => (
      <svg className="w-6 h-6 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
      </svg>
    );

    const IconHistory = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconCheckCircle = () => (
      <svg className="w-5 h-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconAlertTriangle = () => (
      <svg className="w-5 h-5 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    );

    const IconLightbulb = () => (
      <svg className="w-5 h-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 18v-5.25m0 0a3 3 0 10-3-3m3 3a3 3 0 103-3m-9 13.5h12a2.25 2.25 0 002.25-2.25V9A2.25 2.25 0 0015 6.75H9A2.25 2.25 0 006.75 9v9.75A2.25 2.25 0 009 20.25z" />
      </svg>
    );

    const IconHelpCircle = () => (
      <svg className="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" />
      </svg>
    );

    const IconCopy = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376A8.965 8.965 0 0012 12.75a8.965 8.965 0 00-3.75 1.25m9 3.25c.194.165.45.258.717.258H19.5a2.25 2.25 0 002.25-2.25v-9.75a2.25 2.25 0 00-2.25-2.25h-5.25A2.25 2.25 0 0012 5.25V6.75" />
      </svg>
    );

    const IconInfo = () => (
      <svg className="w-5 h-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 111.086 1.086L11.25 13.5v.75m0-6h.008v.008H11.25V8.25zm.75 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconTrash = () => (
      <svg className="w-4 h-4 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0" />
      </svg>
    );

    // --- MAIN REACT APPLICATION ---
    function App() {
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [session, setSession] = useState(null);
      const [user, setUser] = useState(null);
      const [history, setHistory] = useState([]);

      // Onboarding & Flow States
      const [flowState, setFlowState] = useState('landing'); // 'landing', 'cv_upload', 'job_input', 'loading', 'preview', 'full_result', 'dashboard'
      const [showOnboarding, setShowOnboarding] = useState(false);
      const [activeTab, setActiveTab] = useState('report'); // 'report', 'history'

      // Form State
      const [file, setFile] = useState(null);
      const [url, setUrl] = useState('');
      const [textFallback, setTextFallback] = useState('');
      const [jobMethod, setJobMethod] = useState('url'); // 'url', 'text'
      const [dragActive, setDragActive] = useState(false);

      // Loading & Analysis State
      const [loadingStatus, setLoadingStatus] = useState('');
      const [results, setResults] = useState(null);
      const [error, setError] = useState(null);

      // Auth UI State
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      // Onboarding Fields
      const [obStatus, setObStatus] = useState('');
      const [obRoles, setObRoles] = useState('');
      const [obLocation, setObLocation] = useState('Remote');
      const [obSearch, setObSearch] = useState('');
      const [obLoading, setObLoading] = useState(false);

      // Privacy Tooltip State
      const [showPrivacyTooltip, setShowPrivacyTooltip] = useState(false);

      useEffect(() => {
        fetch('/api/config')
          .then((res) => res.json())
          .then((cfg) => {
            if (cfg.supabase_url && cfg.supabase_anon_key) {
              const client = supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
              setSupabaseClient(client);

              client.auth.getSession().then(({ data: { session } }) => {
                setSession(session);
                setUser(session?.user ?? null);
                if (session) {
                  loadHistory(session.access_token);
                  setFlowState('dashboard');
                }
              });

              const { data: { subscription } } = client.auth.onAuthStateChange((_event, session) => {
                setSession(session);
                setUser(session?.user ?? null);
                if (session) {
                  loadHistory(session.access_token);
                } else {
                  setHistory([]);
                  setFlowState('landing');
                }
              });

              return () => subscription.unsubscribe();
            }
          })
          .catch((err) => console.error("Supabase config yükleme hatası:", err));
      }, []);

      const loadHistory = async (token) => {
        try {
          const res = await fetch('/api/history', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setHistory(data);
          }
        } catch (err) {
          console.error("Geçmiş yükleme hatası:", err);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!supabaseClient) return;
        setAuthLoading(true);
        setAuthError('');
        setAuthSuccess('');

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          setAuthSuccess("Giriş başarılı! Yönlendiriliyorsunuz...");
          
          // Re-trigger the analysis with the new session
          setTimeout(() => {
            setShowAuthModal(false);
            resetAuthForm();
            if (file && (url || textFallback)) {
              runAnalysis(data.session.access_token, true);
            } else {
              setFlowState('dashboard');
            }
          }, 1000);
        } catch (err) {
          setAuthError(err.message || "Giriş yapılamadı.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleSignUp = async (e) => {
        e.preventDefault();
        if (!supabaseClient) return;
        setAuthLoading(true);
        setAuthError('');
        setAuthSuccess('');

        try {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          setAuthSuccess("Kayıt başarılı! Hesabınız açıldı.");
          
          setTimeout(() => {
            setShowAuthModal(false);
            resetAuthForm();
            // User signed up, we can trigger onboarding next
            setShowOnboarding(true);
            if (file && (url || textFallback)) {
              runAnalysis(data.session.access_token, true);
            } else {
              setFlowState('dashboard');
            }
          }, 1000);
        } catch (err) {
          setAuthError(err.message || "Kayıt işlemi başarısız.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        if (!supabaseClient) return;
        await supabaseClient.auth.signOut();
        setFile(null);
        setUrl('');
        setTextFallback('');
        setResults(null);
        setFlowState('landing');
      };

      const resetAuthForm = () => {
        setEmail('');
        setPassword('');
        setAuthError('');
        setAuthSuccess('');
      };

      // Direct Onboarding submission
      const handleOnboardingSubmit = async (e) => {
        e.preventDefault();
        if (!session?.access_token) {
          setShowOnboarding(false);
          return;
        }
        setObLoading(true);

        try {
          const rolesArray = obRoles.split(',').map(r => r.trim()).filter(r => r.length > 0);
          const response = await fetch('/api/profile', {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${session.access_token}`
            },
            body: JSON.stringify({
              current_status: obStatus,
              target_roles: rolesArray,
              preferred_location: obLocation,
              job_search_status: obSearch
            })
          });

          if (response.ok) {
            setShowOnboarding(false);
          }
        } catch (err) {
          console.error("Onboarding kaydetme hatası:", err);
        } finally {
          setObLoading(false);
        }
      };

      // Analysis Runner
      const triggerAnalysis = (e) => {
        e.preventDefault();
        if (!file) {
          setError("Lütfen önce bir CV yükleyin.");
          return;
        }
        if (jobMethod === 'url' && !url.trim()) {
          setError("Lütfen geçerli bir ilan linki girin.");
          return;
        }
        if (jobMethod === 'text' && !textFallback.trim()) {
          setError("Lütfen ilan metnini yapıştırın.");
          return;
        }

        setError(null);
        runAnalysis(session?.access_token || null, false);
      };

      const runAnalysis = async (token, isPostLogin = false) => {
        setFlowState('loading');
        setResults(null);

        const steps = [
          "CV'nizdeki deneyimleri inceliyoruz...",
          "İlanın beklentilerini çıkarıyoruz...",
          "Yetkinliklerinizi karşılaştırıyoruz...",
          "Eksik anahtar kelimeleri kontrol ediyoruz...",
          "Sana özel önerileri hazırlıyoruz..."
        ];
        
        let currentStep = 0;
        setLoadingStatus(steps[currentStep]);
        
        const interval = setInterval(() => {
          if (currentStep < steps.length - 1) {
            currentStep++;
            setLoadingStatus(steps[currentStep]);
          }
        }, 2000);

        try {
          const formData = new FormData();
          formData.append("cv_file", file);
          if (url && jobMethod === 'url') formData.append("job_url", url);
          if (textFallback && jobMethod === 'text') formData.append("job_text_fallback", textFallback);

          const headers = {};
          if (token) {
            headers["Authorization"] = `Bearer ${token}`;
          }

          const response = await fetch("/api/analyze", {
            method: "POST",
            headers: headers,
            body: formData,
          });

          clearInterval(interval);

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.detail || "Sunucuyla iletişim kurulurken bir hata oluştu.");
          }

          const data = await response.json();
          setResults(data);

          if (token) {
            loadHistory(token);
            setFlowState('full_result');
          } else {
            setFlowState('preview');
          }
        } catch (err) {
          clearInterval(interval);
          setError(err.message || "İşlem sırasında bilinmeyen bir hata meydana geldi.");
          setFlowState(file ? 'job_input' : 'cv_upload');
        }
      };

      const handleDrag = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.type === "dragenter" || e.type === "dragover") {
          setDragActive(true);
        } else if (e.type === "dragleave") {
          setDragActive(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragActive(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          const droppedFile = e.dataTransfer.files[0];
          if (droppedFile.type === "application/pdf") {
            setFile(droppedFile);
            setFlowState('job_input');
          } else {
            alert("Lütfen yalnızca PDF formatında bir dosya yükleyin.");
          }
        }
      };

      const loadSavedResult = (scan) => {
        setResults(scan.results);
        setFlowState('full_result');
        setActiveTab('report');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* NAVIGATION BAR */}
          <nav className="bg-white/95 backdrop-blur-md border-b border-slate-100 py-4 px-6 sticky top-0 z-50 shadow-sm shrink-0">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => user ? setFlowState('dashboard') : setFlowState('landing')}>
                <div className="p-2.5 bg-indigo-600 rounded-2xl text-white shadow-md shadow-indigo-600/20">
                  <IconFileText className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="text-xl font-black text-slate-800 tracking-tight">CV Matcher</h1>
                  <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest -mt-0.5 font-mono">Autofit AI</p>
                </div>
              </div>
              
              <div className="flex items-center gap-4">
                {user ? (
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => { setFile(null); setUrl(''); setTextFallback(''); setFlowState('cv_upload'); }}
                      className="hidden sm:flex py-2 px-4 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 rounded-2xl text-xs font-black transition-all"
                    >
                      Yeni Analiz Yap
                    </button>
                    <button
                      onClick={() => setFlowState('dashboard')}
                      className={`py-2 px-4 rounded-xl text-xs font-extrabold ${flowState === 'dashboard' ? 'bg-slate-100 text-slate-800' : 'text-slate-500 hover:text-slate-800'}`}
                    >
                      Analizlerim
                    </button>
                    <button
                      onClick={handleLogout}
                      className="py-2 px-4 border border-slate-200 hover:border-rose-200 hover:bg-rose-50 text-slate-650 hover:text-rose-600 rounded-2xl text-xs font-bold transition-all"
                    >
                      Çıkış Yap
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => { resetAuthForm(); setIsSignUp(false); setShowAuthModal(true); }}
                    className="py-2.5 px-5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-sm font-bold shadow-md shadow-indigo-600/10 hover:shadow-indigo-600/20 transition-all transform active:scale-95"
                  >
                    Giriş Yap
                  </button>
                )}
              </div>
            </div>
          </nav>

          {/* MAIN CONTAINER */}
          <main className="flex-grow max-w-7xl w-full mx-auto p-6 flex flex-col justify-center">

            {/* ERROR CARD */}
            {error && (
              <div className="max-w-xl mx-auto w-full mb-6 p-4 bg-rose-50 border border-rose-100 text-rose-700 rounded-3xl flex items-start gap-3 text-sm animate-fadeIn shadow-sm">
                <IconAlertTriangle />
                <div>
                  <p className="font-extrabold">Bir Sorun Oluştu</p>
                  <p className="mt-0.5 text-xs font-semibold">{error}</p>
                </div>
              </div>
            )}

            {/* 1. LANDING PAGE STATE */}
            {flowState === 'landing' && (
              <div className="py-12 space-y-12 max-w-5xl mx-auto w-full text-center animate-fadeIn">
                <div className="space-y-6">
                  <span className="px-4 py-2 bg-indigo-50 text-indigo-700 rounded-full text-xs font-extrabold border border-indigo-100 uppercase tracking-wider">
                    Özgeçmiş Eşleştirme Motoru
                  </span>
                  <h1 className="text-4xl md:text-6xl font-black text-slate-800 tracking-tight leading-tight max-w-3xl mx-auto">
                    Bu işe ne kadar uygunsun?
                  </h1>
                  <p className="text-md md:text-lg text-slate-555 max-w-2xl mx-auto leading-relaxed">
                    CV'ni ve iş ilanını ekle. Uygunluk skorunu, güçlü yönlerini, eksiklerini ve CV'ni nasıl geliştirebileceğini saniyeler içinde gör.
                  </p>
                  <div className="pt-4 flex flex-col sm:flex-row justify-center gap-4">
                    <button
                      onClick={() => setFlowState('cv_upload')}

                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="••••••••"
                      className="block w-full px-4 py-3 border border-slate-200 rounded-2xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all bg-slate-50/50"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={authLoading}
                    className="w-full py-3.5 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-md transition-all flex items-center justify-center"
                  >
                    {authLoading ? (
                      <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    ) : isSignUp ? "Hesap Oluştur" : "Giriş Yap"}
                  </button>
                </form>

                <div className="mt-6 border-t border-slate-100 pt-4 text-center">
                  <button
                    onClick={() => { setIsSignUp(!isSignUp); resetAuthForm(); }}
                    className="text-xs font-extrabold text-indigo-600 hover:text-indigo-850 transition-colors"
                  >
                    {isSignUp ? "Zaten hesabın var mı? Giriş yap" : "Hesabınız yok mu? Hesap Oluşturun"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PROFILE ONBOARDING MODAL */}
          {showOnboarding && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-white rounded-3xl shadow-2xl border border-slate-100 w-full max-w-md p-6 relative overflow-hidden space-y-6">
                
                <div className="text-center space-y-2">
                  <h3 className="text-xl font-black text-slate-800">Sana daha iyi öneriler verelim 🎯</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">30 saniyede birkaç bilgiyle deneyimini kişiselleştirebiliriz.</p>
                </div>

                <form onSubmit={handleOnboardingSubmit} className="space-y-4">
                  {/* Status selection */}
                  <div>
                    <label className="block text-xs font-bold text-slate-450 uppercase tracking-wider mb-2">Mevcut Durum</label>
                    <select
                      value={obStatus}
                      onChange={(e) => setObStatus(e.target.value)}
                      className="block w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                    >
                      <option value="">Seçiniz...</option>
                      <option value="student">Öğrenciyim</option>
                      <option value="graduate">Yeni Mezunum</option>
                      <option value="early_career">1-3 Yıl Deneyim</option>
                      <option value="professional">3+ Yıl Deneyim</option>
                    </select>
                  </div>

                  {/* Target Roles */}
                  <div>
                    <label className="block text-xs font-bold text-slate-450 uppercase tracking-wider mb-1.5">Hedeflediğin Roller</label>
                    <input
                      type="text"
                      value={obRoles}
                      onChange={(e) => setObRoles(e.target.value)}
                      placeholder="Örn: Product, Growth, Finance, Data..."
                      className="block w-full px-4 py-2.5 border border-slate-200 rounded-xl text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 bg-slate-50/50"
                    />
                  </div>

                  {/* Location Preference */}
                  <div>
                    <label className="block text-xs font-bold text-slate-450 uppercase tracking-wider mb-2">Lokasyon Tercihi</label>
                    <select
                      value={obLocation}
                      onChange={(e) => setObLocation(e.target.value)}
                      className="block w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                    >
                      <option value="Istanbul">İstanbul</option>
                      <option value="Turkiye">Türkiye geneli</option>
                      <option value="Remote">Remote (Uzaktan)</option>
                      <option value="Other">Diğer (Yurt dışı)</option>
                    </select>
                  </div>

                  {/* Job Search Status */}
                  <div>
                    <label className="block text-xs font-bold text-slate-450 uppercase tracking-wider mb-2">İş Arama Durumu</label>
                    <select
                      value={obSearch}
                      onChange={(e) => setObSearch(e.target.value)}
                      className="block w-full px-4 py-2.5 border border-slate-200 rounded-xl bg-slate-50/50 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500"
                    >
                      <option value="">Seçiniz...</option>
                      <option value="active">Aktif olarak iş arıyorum</option>
                      <option value="open">Fırsatlara açığım</option>
                      <option value="just_improving">Şimdilik sadece CV'mi geliştiriyorum</option>
                    </select>
                  </div>

                  <button
                    type="submit"
                    disabled={obLoading}
                    className="w-full py-3 px-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl shadow-md transition-all flex items-center justify-center"
                  >
                    {obLoading ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : "Kişiselleştirmeyi Tamamla"}
                  </button>
                  
                  <button
                    type="button"
                    onClick={() => setShowOnboarding(false)}
                    className="w-full text-center text-xs font-semibold text-slate-400 hover:text-slate-600 transition-colors"
                  >
                    Şimdilik geç
                  </button>
                </form>

              </div>
            </div>
          )}

        </div>
      );
    }

    // --- Loading Spinner Component ---
    function LoadingSpinner({ status }) {
      return (
        <div className="flex flex-col items-center justify-center p-12 text-center bg-white rounded-3xl border border-slate-100 shadow-md min-h-[450px]">
          <div className="relative flex items-center justify-center">
            <div className="w-20 h-20 border-4 border-indigo-50 rounded-full"></div>
            <div className="absolute w-20 h-20 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
          </div>
          <h3 className="mt-8 text-xl font-bold text-slate-800 animate-pulse">Analiz Devam Ediyor</h3>
          <p className="mt-2 text-sm text-slate-500 max-w-xs">{status}</p>
        </div>
      );
    }

    // --- AnalysisResults Component ---
    function AnalysisResults({ results, onOpenAuthModal }) {
      const [copiedIndex, setCopiedIndex] = useState(null);
      const [checkedKeywords, setCheckedKeywords] = useState({});
      const [subTab, setSubTab] = useState('general'); // 'general', 'suggestions', 'ats'

      if (!results) return null;

      const {
        uygunluk_skoru,
        ozet,
        guclu_yonler,
        eksik_yonler,
        optimizasyon_onerileri,
        mulakat_sorulari,
        eksik_ats_anahtar_kelimeleri,
        cv_optimizasyon_kilavuzu
      } = results;

      const copyToClipboard = (text, index) => {
        navigator.clipboard.writeText(text);
        setCopiedIndex(index);
        setTimeout(() => setCopiedIndex(null), 2000);
      };

      const toggleKeyword = (kw) => {
        setCheckedKeywords(prev => ({ ...prev, [kw]: !prev[kw] }));
      };

      const isLocked = (list) => {
        return list && list.length === 1 && list[0].includes("(Kilitli Özellik)");
      };

      const isGuideLocked = () => {
        return cv_optimizasyon_kilavuzu && cv_optimizasyon_kilavuzu.length === 1 && cv_optimizasyon_kilavuzu[0].mevcut_cumle.includes("(Kilitli Özellik)");
      };

      const renderLockedState = (title) => (
        <div className="bg-slate-50/80 p-8 rounded-3xl border border-slate-200/60 border-dashed text-center flex flex-col items-center justify-center min-h-[280px] animate-fadeIn">
          <div className="p-4 bg-indigo-50 text-indigo-600 rounded-2xl mb-4 shadow-inner">
            <IconLock />
          </div>
          <h4 className="font-extrabold text-slate-800 text-sm">{title}</h4>
          <p className="text-xs text-slate-500 max-w-sm mt-2 leading-relaxed">
            Bu gelişmiş analiz detayına, ATS kelime checklistine ve satır satır revize önerilerine erişmek için lütfen ücretsiz giriş yapın veya üye olun.
          </p>
          <button
            onClick={onOpenAuthModal}
            className="mt-5 py-3 px-6 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-xs font-black shadow-md shadow-indigo-600/10 hover:shadow-indigo-600/20 active:scale-95 transition-all"
          >
            Ücretsiz Giriş Yap / Üye Ol
          </button>
        </div>
      );

      // Suitability recommendation class
      const getSuitabilityMeta = (score) => {
        if (score >= 80) return { label: "Güçlü Eşleşme", class: "text-emerald-600 bg-emerald-50", desc: "Evet, güçlü aday görünüyorsunuz." };
        if (score >= 50) return { label: "Orta Eşleşme", class: "text-amber-600 bg-amber-50", desc: "Evet, ancak CV'nizi önce geliştirmenizi öneriyoruz." };
        return { label: "Geliştirme Gerekli", class: "text-rose-600 bg-rose-50", desc: "Rol beklentileriyle önemli farklar bulunuyor." };
      };

      const meta = getSuitabilityMeta(uygunluk_skoru);

      return (
        <div className="space-y-6">
          
          {/* Sub Tab headers */}
          <div className="flex gap-2 bg-slate-100 p-1.5 rounded-2xl w-full border border-slate-200/40">
            <button
              onClick={() => setSubTab('general')}
              className={`flex-grow py-2.5 rounded-xl text-xs font-extrabold transition-all ${subTab === 'general' ? 'bg-white text-indigo-650 shadow-sm' : 'text-slate-500 hover:text-slate-850'}`}
            >
              Genel Rapor
            </button>
            <button
              onClick={() => setSubTab('suggestions')}
              className={`flex-grow py-2.5 rounded-xl text-xs font-extrabold transition-all ${subTab === 'suggestions' ? 'bg-white text-indigo-650 shadow-sm' : 'text-slate-500 hover:text-slate-850'}`}
            >
              Tavsiyeler & Sorular
            </button>
            <button
              onClick={() => setSubTab('ats')}
              className={`flex-grow py-2.5 rounded-xl text-xs font-extrabold transition-all flex items-center justify-center gap-1.5 ${subTab === 'ats' ? 'bg-white text-indigo-650 shadow-sm' : 'text-slate-500 hover:text-slate-850'}`}
            >
              {isGuideLocked() && <IconLock className="w-3 h-3 text-slate-400" />}
              ATS & CV İyileştirme
            </button>
          </div>

          {/* --- TAB 1: GENERAL REPORT --- */}
          {subTab === 'general' && (
            <div className="space-y-6 animate-fadeIn">
              
              {/* Score & Suitability answer card */}
              <div className="grid grid-cols-1 md:grid-cols-12 gap-6">
                
                {/* Score panel */}
                <div className="md:col-span-4 bg-white p-6 rounded-3xl border border-slate-100 shadow-md flex flex-col items-center justify-center text-center">
                  <div className="relative flex items-center justify-center w-28 h-28">
                    <svg className="w-full h-full transform -rotate-90">
                      <circle cx="56" cy="56" r="48" className="text-slate-100" strokeWidth="8" stroke="currentColor" fill="transparent" />
                      <circle
                        cx="56"
                        cy="56"
                        r="48"
                        className={`transition-all duration-700 ${uygunluk_skoru >= 80 ? 'text-emerald-500' : uygunluk_skoru >= 50 ? 'text-amber-500' : 'text-rose-500'}`}
                        strokeWidth="8"
                        strokeDasharray={301.6}
                        strokeDashoffset={301.6 - (301.6 * uygunluk_skoru) / 100}
                        strokeLinecap="round"
                        stroke="currentColor"
                        fill="transparent"
                      />
                    </svg>
                    <span className="absolute text-3xl font-black text-slate-850">%{uygunluk_skoru}</span>
                  </div>
                  <span className={`mt-3 py-1 px-3 rounded-full text-xs font-black ${meta.class}`}>{meta.label}</span>
                  <p className="text-[10px] text-slate-400 mt-2 font-semibold">CV ile ilan arasındaki içerik ve yetkinlik uyumunu gösterir.</p>
                </div>

                {/* Suitability recommendation panel */}
                <div className="md:col-span-8 bg-white p-6 rounded-3xl border border-slate-100 shadow-md space-y-4 flex flex-col justify-center">
                  <div>
                    <span className="text-[10px] font-black text-slate-400 uppercase tracking-widest block">Başvurmalı mısın?</span>
                    <h4 className="text-lg font-black text-slate-800 mt-1">{meta.desc}</h4>
                  </div>
                  <div>
                    <h5 className="text-xs font-bold text-slate-800">Genel Değerlendirme</h5>
                    <p className="text-xs text-slate-600 mt-1.5 leading-relaxed font-semibold">{ozet}</p>
                  </div>
                </div>

              </div>

              {/* Strengths & Missing sections */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-md">
                  <h3 className="text-sm font-black text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-50 pb-2">
                    <IconCheckCircle /> Güçlü Eşleşmeler
                  </h3>
                  {guclu_yonler && guclu_yonler.length > 0 ? (
                    <ul className="space-y-3">
                      {guclu_yonler.map((item, idx) => (
                        <li key={idx} className="flex gap-2.5 text-xs text-slate-600 items-start font-semibold">
                          <span className="w-1.5 h-1.5 rounded-full bg-emerald-500 mt-2 shrink-0"></span>
                          <span>{item}</span>
                        </li>
                      ))}
                    </ul>
                  ) : <p className="text-xs text-slate-400">Belirgin bir eşleşme bulunmuyor.</p>}
                </div>

                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-md">
                  <h3 className="text-sm font-black text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-50 pb-2">
                    <IconAlertTriangle /> Eksik Gereksinimler
                  </h3>
                  {isLocked(eksik_yonler) ? (
                    renderLockedState("Eksik Analizi")
                  ) : eksik_yonler && eksik_yonler.length > 0 ? (
                    <ul className="space-y-3">
                      {eksik_yonler.map((item, idx) => (
                        <li key={idx} className="flex gap-2.5 text-xs text-slate-600 items-start font-semibold">
                          <span className="w-1.5 h-1.5 rounded-full bg-rose-500 mt-2 shrink-0"></span>
                          <span>{item}</span>
                        </li>
                      ))}
                    </ul>
                  ) : <p className="text-xs text-slate-400">Kritik bir eksik tespit edilmedi.</p>}
                </div>
              </div>

            </div>
          )}

          {/* --- TAB 2: SUGGESTIONS & INTERVIEW QUESTIONS --- */}
          {subTab === 'suggestions' && (
            <div className="space-y-6 animate-fadeIn">
              <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-md">
                <h3 className="text-sm font-black text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-50 pb-2">
                  <IconLightbulb /> CV İyileştirme Önerileri
                </h3>
                {isLocked(optimizasyon_onerileri) ? (
                  renderLockedState("Optimizasyon Önerileri")
                ) : optimizasyon_onerileri && optimizasyon_onerileri.length > 0 ? (
                  <ul className="space-y-3.5">
                    {optimizasyon_onerileri.map((item, idx) => (
                      <li key={idx} className="flex gap-3 text-xs text-slate-600 items-start font-semibold leading-relaxed">
                        <div className="p-1 bg-indigo-50 rounded text-indigo-650 mt-0.5 shrink-0">
                          <IconLightbulb className="w-3.5 h-3.5" />
                        </div>
                        <span>{item}</span>
                      </li>
                    ))}
                  </ul>
                ) : <p className="text-xs text-slate-400">Tavsiye bulunmuyor.</p>}
              </div>

              <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-md">
                <h3 className="text-sm font-black text-slate-800 mb-4 flex items-center gap-2 border-b border-slate-50 pb-2">
                  <IconHelpCircle /> Mülakat Soru Simülasyonu
                </h3>
                {isLocked(mulakat_sorulari) ? (
                  renderLockedState("Mülakat Hazırlık Soruları")
                ) : mulakat_sorulari && mulakat_sorulari.length > 0 ? (
                  <div className="space-y-3">
                    {mulakat_sorulari.map((item, idx) => (
                      <div key={idx} className="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100 gap-3">
                        <span className="text-xs text-slate-700 font-bold">{item}</span>
                        <button
                          onClick={() => copyToClipboard(item, idx)}
                          className="p-2 bg-white border border-slate-200 hover:border-indigo-500 text-slate-400 hover:text-indigo-650 rounded-xl shadow-sm shrink-0 transition-all"
                        >
                          {copiedIndex === idx ? <IconCheck /> : <IconCopy />}
                        </button>
                      </div>
                    ))}
                  </div>
                ) : <p className="text-xs text-slate-400">Soru bulunmuyor.</p>}
              </div>
            </div>
          )}

          {/* --- TAB 3: ATS & CV OPTIMIZATION --- */}
          {subTab === 'ats' && (
            <div className="space-y-6 animate-fadeIn">
              {isGuideLocked() ? (
                renderLockedState("ATS Kelime Listesi ve Satır Satır Revize Kılavuzu")
              ) : (
                <>
                  {/* Missing Keywords Checklist */}
                  <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-md">
                    <h3 className="text-sm font-black text-slate-800 mb-2 flex items-center gap-2 border-b border-slate-50 pb-2">
                      <IconSparkles /> Eksik ATS Anahtar Kelimeleri
                    </h3>
                    <p className="text-xs text-slate-500 mb-4">Bu kelimeler ilanda kritik önem taşıyor ancak CV'nizde bulunamadı. Ekledikçe işaretleyebilirsiniz:</p>
                    {eksik_ats_anahtar_kelimeleri && eksik_ats_anahtar_kelimeleri.length > 0 ? (
                      <div className="flex flex-wrap gap-2.5">
                        {eksik_ats_anahtar_kelimeleri.map((kw, idx) => {
                          const isChecked = !!checkedKeywords[kw];
                          return (
                            <button
                              key={idx}
                              onClick={() => toggleKeyword(kw)}
                              className={`py-2 px-4 rounded-xl text-xs font-bold border transition-all flex items-center gap-2 ${
                                isChecked
                                  ? 'bg-emerald-50 text-emerald-705 border-emerald-200 shadow-sm font-black'
                                  : 'bg-slate-50 text-slate-650 hover:bg-slate-100 border-slate-200'
                              }`}
                            >
                              <span className={`w-3.5 h-3.5 rounded-md flex items-center justify-center border transition-all ${
                                isChecked ? 'bg-emerald-500 border-emerald-600' : 'bg-white border-slate-300'
                              }`}>
                                {isChecked && <IconCheck className="w-2.5 h-2.5 text-white stroke-[3.5]" />}
                              </span>
                              {kw}
                            </button>
                          );
                        })}
                      </div>
                    ) : <p className="text-xs text-slate-400">CV'niz ilanın tüm kritik anahtar kelimelerini içeriyor!</p>}
                  </div>

                  {/* Before/After Customizations */}
                  <div className="space-y-4">
                    <h3 className="text-sm font-black text-slate-805 flex items-center gap-2 px-1">
                      <IconSparkles className="w-5 h-5 text-indigo-500 animate-pulse" />
                      CV Satır Satır Revize Önerileri
                    </h3>
                    {cv_optimizasyon_kilavuzu && cv_optimizasyon_kilavuzu.length > 0 ? (
                      cv_optimizasyon_kilavuzu.map((item, idx) => (
                        <div key={idx} className="bg-white rounded-3xl border border-slate-100 shadow-md overflow-hidden animate-fadeIn">
                          <div className="p-5 space-y-4">
                            <div className="grid grid-cols-1 md:grid-cols-12 gap-4 items-center">
                              {/* Before */}
                              <div className="md:col-span-5 bg-rose-50/40 p-4 rounded-2xl border border-rose-100/50">
                                <span className="inline-block px-2 py-0.5 bg-rose-100 text-rose-700 rounded-md text-[9px] font-black uppercase mb-2">Mevcut CV Cümlesi</span>
                                <p className="text-xs font-semibold text-slate-500 italic leading-relaxed">"{item.mevcut_cumle}"</p>
                              </div>

                              {/* Arrow */}
                              <div className="md:col-span-2 flex justify-center text-slate-300 shrink-0">
                                <IconArrowRight />
                              </div>

                              {/* After */}
                              <div className="md:col-span-5 bg-emerald-50/30 p-4 rounded-2xl border border-emerald-100/50">
                                <span className="inline-block px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-md text-[9px] font-black uppercase mb-2">ATS Uyumlu Yeni Cümle</span>
                                <p className="text-xs font-bold text-slate-805 leading-relaxed">"{item.onerilen_cumle}"</p>
                              </div>
                            </div>

                            {/* Expert tip */}
                            <div className="bg-indigo-50/20 p-4 rounded-2xl border border-indigo-100/50 flex gap-2.5 items-start">
                              <div className="p-1 bg-indigo-100 rounded text-indigo-650 mt-0.5 shrink-0">
                                <IconSparkles className="w-3.5 h-3.5 text-indigo-600" />
                              </div>
                              <div>
                                <span className="block text-[9px] font-black text-indigo-700 uppercase">İK Yöneticisi Önerisi:</span>
                                <p className="text-xs text-slate-650 font-medium mt-0.5 leading-relaxed">{item.aciklama}</p>
                              </div>
                            </div>
                          </div>
                        </div>
                      ))
                    ) : <p className="text-xs text-slate-400">Yeniden yazım önerisi bulunamadı.</p>}
                  </div>
                </>
              )}
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
