<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Matcher - AI Destekli CV Uygunluk Analizörü</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Babel CDN (JSX compiler) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              DEFAULT: '#4f46e5', // indigo-600
              hover: '#4338ca',   // indigo-700
              light: '#e0e7ff',   // indigo-100
            }
          },
          animation: {
            'bounce-slow': 'bounce 3s infinite',
          }
        }
      }
    }
  </script>
  <style>
    html {
      scroll-behavior: smooth;
    }
    .gradient-bg {
      background: radial-gradient(circle at 50% 50%, rgba(79, 70, 229, 0.05) 0%, rgba(255, 255, 255, 0) 100%);
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen font-sans antialiased gradient-bg">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    // --- Inline SVG Icons ---
    const IconUpload = () => (
      <svg className="w-12 h-12 mb-4 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
      </svg>
    );

    const IconFileText = ({ className = "w-5 h-5 text-indigo-600" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
      </svg>
    );

    const IconX = () => (
      <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const IconBriefcase = () => (
      <svg className="w-5 h-5 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M20.25 14.15v4.25c0 .621-.504 1.125-1.125 1.125H4.875c-.621 0-1.125-.504-1.125-1.125v-4.25m16.5 0a2.18 2.18 0 00.75-1.661V8.706c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 00-3.413-.387m4.5 8.006c-.194.165-.45.258-.717.258H3.74c-.266 0-.523-.093-.717-.258m16.5 0a2.18 2.18 0 01-.75 1.661v3.351a2.18 2.18 0 01-.75 1.661H4.875a2.18 2.18 0 01-.75-1.661v-3.351a2.18 2.18 0 01-.75-1.661m16.5 0c0-1.081-.768-2.015-1.837-2.175a48.114 48.114 0 00-3.413-.387m-11.82 0c-1.07.16-1.837 1.094-1.837 2.175v1.2a2.18 2.18 0 00.75 1.66m1.837-5.036c.642.096 1.285.19 1.929.282m0 0c.643.091 1.286.177 1.93.256m-3.859-.538a48.17 48.17 0 013.859-.538m0 0a48.109 48.109 0 013.859.538m0 0c.643-.079 1.286-.165 1.929-.256m-5.788.794a48.204 48.204 0 005.788 0m-5.788 0v2.25m5.788-2.25v2.25m-5.788 0h5.788" />
      </svg>
    );

    const IconLink = () => (
      <svg className="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
      </svg>
    );

    const IconChevronDown = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19.5 8.25l-7.5 7.5-7.5-7.5" />
      </svg>
    );

    const IconChevronUp = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 15.75l7.5-7.5 7.5 7.5" />
      </svg>
    );

    const IconCheckCircle = () => (
      <svg className="w-5 h-5 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconAlertTriangle = () => (
      <svg className="w-5 h-5 text-rose-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    );

    const IconLightbulb = () => (
      <svg className="w-5 h-5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 18v-5.25m0 0a3 3 0 10-3-3m3 3a3 3 0 103-3m-9 13.5h12a2.25 2.25 0 002.25-2.25V9A2.25 2.25 0 0015 6.75H9A2.25 2.25 0 006.75 9v9.75A2.25 2.25 0 009 20.25z" />
      </svg>
    );

    const IconHelpCircle = () => (
      <svg className="w-5 h-5 text-blue-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9 5.25h.008v.008H12v-.008z" />
      </svg>
    );

    const IconCopy = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 17.25v3.375c0 .621-.504 1.125-1.125 1.125h-9.75a1.125 1.125 0 01-1.125-1.125V7.875c0-.621.504-1.125 1.125-1.125H6.75a9.06 9.06 0 011.5.124m7.5 10.376A8.965 8.965 0 0012 12.75a8.965 8.965 0 00-3.75 1.25m9 3.25c.194.165.45.258.717.258H19.5a2.25 2.25 0 002.25-2.25v-9.75a2.25 2.25 0 00-2.25-2.25h-5.25A2.25 2.25 0 0012 5.25V6.75" />
      </svg>
    );

    const IconCheck = () => (
      <svg className="w-4 h-4 text-emerald-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" />
      </svg>
    );

    const IconPlay = () => (
      <svg className="w-4 h-4 text-white" fill="currentColor" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" />
      </svg>
    );

    const IconAlertCircle = () => (
      <svg className="w-5 h-5 text-rose-700 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" />
      </svg>
    );

    const IconInfo = () => (
      <svg className="w-6 h-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M11.25 11.25l.041-.02a.75.75 0 111.063.852l-.708 2.836a.75.75 0 001.063.852l.041-.021M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-9-3.75h.008v.008H12V8.25z" />
      </svg>
    );

    const IconStars = () => (
      <svg className="w-6 h-6 text-indigo-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9.813 15.904L9 21l8.913-5.096L17 21l1.813-5.096C20.672 15.02 22 13.18 22 11c0-3.314-2.686-6-6-6s-6 2.686-6 6c0 2.18 1.328 4.02 3.187 4.904z" />
      </svg>
    );

    // --- UI Arayüz Bileşenleri ---

    // LoadingSpinner
    function LoadingSpinner({ status }) {
      return (
        <div className="flex flex-col items-center justify-center p-12 text-center bg-white rounded-3xl border border-slate-100 shadow-md h-full min-h-[450px]">
          <div className="relative flex items-center justify-center">
            <div className="w-20 h-20 border-4 border-indigo-50 rounded-full"></div>
            <div className="absolute w-20 h-20 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
          </div>
          <h3 className="mt-8 text-xl font-bold text-slate-800 animate-pulse">Analiz Devam Ediyor</h3>
          <p className="mt-2 text-sm text-slate-500 max-w-xs">{status}</p>
          <div className="mt-10 text-xs font-semibold text-indigo-600 bg-indigo-50 px-4 py-2 rounded-full border border-indigo-100/50">
            Gemini 3.6 Flash analiz ediyor...
          </div>
        </div>
      );
    }

    // CVUpload
    function CVUpload({ file, setFile }) {
      const fileInputRef = useRef(null);
      const [isDragActive, setIsDragActive] = useState(false);

      const handleDrag = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.type === "dragenter" || e.type === "dragover") {
          setIsDragActive(true);
        } else if (e.type === "dragleave") {
          setIsDragActive(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setIsDragActive(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          const droppedFile = e.dataTransfer.files[0];
          if (droppedFile.type === "application/pdf") {
            setFile(droppedFile);
          } else {
            alert("Lütfen yalnızca PDF formatında bir dosya yükleyin.");
          }
        }
      };

      return (
        <div className="bg-white p-6 rounded-3xl border border-slate-100/80 shadow-md hover:shadow-lg transition-all duration-300">
          <h2 className="text-lg font-extrabold text-slate-800 mb-4 flex items-center gap-2">
            <IconFileText />
            1. CV (Özgeçmiş) Yükleyin
          </h2>
          <input
            ref={fileInputRef}
            type="file"
            accept=".pdf"
            onChange={(e) => e.target.files[0] && setFile(e.target.files[0])}
            className="hidden"
            id="cv-upload-input"
          />
          {!file ? (
            <label
              htmlFor="cv-upload-input"
              onDragEnter={handleDrag}
              onDragOver={handleDrag}
              onDragLeave={handleDrag}
              onDrop={handleDrop}
              className={`flex flex-col items-center justify-center border-2 border-dashed rounded-2xl p-8 text-center cursor-pointer transition-all duration-300 ${
                isDragActive ? "border-indigo-600 bg-indigo-50/40 scale-[1.01]" : "border-slate-200 hover:border-indigo-500 bg-slate-50/50 hover:bg-slate-50"
              }`}
            >
              <IconUpload />
              <p className="text-sm font-bold text-slate-700">CV dosyasını sürükleyin veya seçin</p>
              <p className="text-xs text-slate-400 mt-1.5">Sadece PDF formatı desteklenir (Maks. 10MB)</p>
            </label>
          ) : (
            <div className="flex items-center justify-between p-4 bg-indigo-50/30 border border-indigo-100/50 rounded-2xl">
              <div className="flex items-center gap-3 overflow-hidden">
                <div className="p-3 bg-indigo-100 text-indigo-600 rounded-xl shrink-0">
                  <IconFileText className="w-6 h-6 text-indigo-600" />
                </div>
                <div className="overflow-hidden">
                  <p className="text-sm font-bold text-slate-800 truncate">{file.name}</p>
                  <p className="text-xs text-slate-500 mt-0.5">{(file.size / (1024 * 1024)).toFixed(2)} MB • PDF</p>
                </div>
              </div>
              <button
                onClick={() => { setFile(null); if(fileInputRef.current) fileInputRef.current.value = ""; }}
                className="p-2 hover:bg-slate-200 text-slate-400 hover:text-slate-600 rounded-xl transition-colors shrink-0"
              >
                <IconX />
              </button>
            </div>
          )}
        </div>
      );
    }

    // JobInput
    function JobInput({ url, setUrl, textFallback, setTextFallback }) {
      const [showFallback, setShowFallback] = useState(false);

      return (
        <div className="bg-white p-6 rounded-3xl border border-slate-100/80 shadow-md hover:shadow-lg transition-all duration-300">
          <h2 className="text-lg font-extrabold text-slate-800 mb-4 flex items-center gap-2">
            <IconBriefcase />
            2. Başvurulacak İlan
          </h2>
          <div className="mb-4">
            <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">İş İlanı Linki (URL)</label>
            <div className="relative">
              <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                <IconLink />
              </div>
              <input
                type="url"
                value={url}
                onChange={(e) => setUrl(e.target.value)}
                placeholder="Örn: https://www.linkedin.com/jobs/view/..."
                className="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-2xl bg-slate-50/50 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all"
              />
            </div>
          </div>
          <div className="mt-4 border-t border-slate-100 pt-3">
            <button
              type="button"
              onClick={() => setShowFallback(!showFallback)}
              className="flex items-center justify-between w-full py-2 text-xs font-bold text-indigo-600 hover:text-indigo-700 transition-colors"
            >
              <span className="flex items-center gap-1.5">
                <IconFileText className="w-4 h-4 text-indigo-600" />
                {showFallback ? "Metin Girişini Kapat" : "İlan Metnini Manuel Yapıştır (Link Çalışmazsa)"}
              </span>
              {showFallback ? <IconChevronUp /> : <IconChevronDown />}
            </button>
            {showFallback && (
              <div className="mt-3 animate-fadeIn">
                <label className="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">İlan Metni</label>
                <textarea
                  value={textFallback}
                  onChange={(e) => setTextFallback(e.target.value)}
                  rows={5}
                  placeholder="İş tanımı, aranan teknik özellikler ve kriterleri buraya yapıştırın..."
                  className="block w-full px-4 py-3 border border-slate-200 rounded-2xl bg-slate-50/50 text-sm placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500/20 focus:border-indigo-500 transition-all resize-none"
                />
                <p className="text-xs text-slate-400 mt-1.5">LinkedIn veya kariyer sitelerindeki bot engellemesini aşmak için ilan metnini buraya yapıştırabilirsiniz.</p>
              </div>
            )}
          </div>
        </div>
      );
    }

    // AnalysisResults
    function AnalysisResults({ results }) {
      const [copiedIndex, setCopiedIndex] = useState(null);
      if (!results) return null;

      const { uygunluk_skoru, ozet, guclu_yonler, eksik_yonler, optimizasyon_onerileri, mulakat_sorulari } = results;

      const copyToClipboard = (text, index) => {
        navigator.clipboard.writeText(text);
        setCopiedIndex(index);
        setTimeout(() => setCopiedIndex(null), 2000);
      };

      return (
        <div className="space-y-6">
          {/* Skor ve Özet */}
          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-md grid grid-cols-1 md:grid-cols-4 gap-6 items-center">
            <div className="flex flex-col items-center justify-center md:border-r md:border-slate-100 pr-0 md:pr-6 shrink-0">
              <div className="relative flex items-center justify-center w-28 h-28">
                <svg className="w-full h-full transform -rotate-90">
                  <circle cx="56" cy="56" r="48" className="text-slate-100" strokeWidth="9" stroke="currentColor" fill="transparent" />
                  <circle
                    cx="56"
                    cy="56"
                    r="48"
                    className={`transition-all duration-700 ${uygunluk_skoru >= 80 ? 'text-emerald-500' : uygunluk_skoru >= 50 ? 'text-amber-500' : 'text-rose-500'}`}
                    strokeWidth="9"
                    strokeDasharray={301.6}
                    strokeDashoffset={301.6 - (301.6 * uygunluk_skoru) / 100}
                    strokeLinecap="round"
                    stroke="currentColor"
                    fill="transparent"
                  />
                </svg>
                <span className="absolute text-3xl font-extrabold text-slate-800">%{uygunluk_skoru}</span>
              </div>
              <span className="mt-3 text-xs font-bold text-slate-400 uppercase tracking-wider">Uygunluk Skoru</span>
            </div>
            <div className="md:col-span-3">
              <h3 className="text-lg font-bold text-slate-800 mb-2">Genel Değerlendirme</h3>
              <p className="text-sm text-slate-600 leading-relaxed font-medium">{ozet}</p>
            </div>
          </div>

          {/* Güçlü ve Eksik Yönler */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-md">
              <h3 className="text-md font-extrabold text-slate-850 mb-4 flex items-center gap-2 border-b border-slate-50 pb-2">
                <IconCheckCircle /> Güçlü Yönler (Eşleşen Yetkinlikler)
              </h3>
              {guclu_yonler && guclu_yonler.length > 0 ? (
                <ul className="space-y-3">
                  {guclu_yonler.map((item, idx) => (
                    <li key={idx} className="flex gap-2.5 text-sm text-slate-650 items-start font-medium">
                      <span className="w-2 h-2 rounded-full bg-emerald-500 mt-2 shrink-0"></span>
                      <span>{item}</span>
                    </li>
                  ))}
                </ul>
              ) : <p className="text-sm text-slate-400">Eşleşen belirgin bir yetkinlik tespit edilemedi.</p>}
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-md">
              <h3 className="text-md font-extrabold text-slate-850 mb-4 flex items-center gap-2 border-b border-slate-50 pb-2">
                <IconAlertTriangle /> Eksik Yönler (Gereksinimler)
              </h3>
              {eksik_yonler && eksik_yonler.length > 0 ? (
                <ul className="space-y-3">
                  {eksik_yonler.map((item, idx) => (
                    <li key={idx} className="flex gap-2.5 text-sm text-slate-650 items-start font-medium">
                      <span className="w-2 h-2 rounded-full bg-rose-500 mt-2 shrink-0"></span>
                      <span>{item}</span>
                    </li>
                  ))}
                </ul>
              ) : <p className="text-sm text-slate-400">İlanda kritik bir eksik yön tespit edilmedi.</p>}
            </div>
          </div>

          {/* İyileştirme Önerileri */}
          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-md">
            <h3 className="text-md font-extrabold text-slate-850 mb-4 flex items-center gap-2 border-b border-slate-50 pb-2">
              <IconLightbulb /> CV İyileştirme ve Optimizasyon Önerileri
            </h3>
            {optimizasyon_onerileri && optimizasyon_onerileri.length > 0 ? (
              <ul className="space-y-3.5">
                {optimizasyon_onerileri.map((item, idx) => (
                  <li key={idx} className="flex gap-3 text-sm text-slate-650 items-start font-medium">
                    <div className="p-1.5 bg-indigo-50 rounded-lg text-indigo-600 shrink-0">
                      <IconLightbulb className="w-4 h-4" />
                    </div>
                    <span className="mt-0.5">{item}</span>
                  </li>
                ))}
              </ul>
            ) : <p className="text-sm text-slate-400">CV'niz oldukça optimize görünüyor.</p>}
          </div>

          {/* Olası Mülakat Soruları */}
          <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-md">
            <h3 className="text-md font-extrabold text-slate-850 mb-4 flex items-center gap-2 border-b border-slate-50 pb-2">
              <IconHelpCircle /> Olası Teknik Mülakat Soruları
            </h3>
            {mulakat_sorulari && mulakat_sorulari.length > 0 ? (
              <div className="space-y-3">
                {mulakat_sorulari.map((item, idx) => (
                  <div key={idx} className="flex items-center justify-between p-3.5 bg-slate-50 rounded-2xl border border-slate-100 gap-3 group">
                    <span className="text-sm text-slate-700 font-semibold">{item}</span>
                    <button
                      onClick={() => copyToClipboard(item, idx)}
                      className="p-2 bg-white border border-slate-200 hover:border-indigo-500 text-slate-400 hover:text-indigo-600 rounded-xl transition-all shadow-sm shrink-0"
                    >
                      {copiedIndex === idx ? <IconCheck /> : <IconCopy />}
                    </button>
                  </div>
                ))}
              </div>
            ) : <p className="text-sm text-slate-400">Soru bulunmuyor.</p>}
          </div>
        </div>
      );
    }

    // --- LANDING PAGE VE ANA SAYFA ---

    function App() {
      const [file, setFile] = useState(null);
      const [url, setUrl] = useState('');
      const [textFallback, setTextFallback] = useState('');
      const [loading, setLoading] = useState(false);
      const [loadingStatus, setLoadingStatus] = useState('');
      const [results, setResults] = useState(null);
      const [error, setError] = useState(null);

      const handleAnalyze = async (e) => {
        e.preventDefault();
        if (!file) {
          setError("Lütfen öncelikle PDF formatında bir CV dosyası yükleyin.");
          return;
        }
        if (!url.trim() && !textFallback.trim()) {
          setError("Lütfen bir iş ilanı linki girin veya ilan detaylarını manuel yapıştırın.");
          return;
        }

        setLoading(true);
        setError(null);
        setResults(null);

        const steps = [
          "CV dosyası okunuyor...",
          "İlan taranıyor...",
          "Detaylar analiz edilmeye başlandı...",
          "Gemini 3.6 Flash ile eşleştirme yapılıyor...",
          "Güçlü ve zayıf yönler ayrıştırılıyor...",
          "Öneriler ve mülakat soruları hazırlanıyor..."
        ];
        
        let currentStep = 0;
        setLoadingStatus(steps[currentStep]);
        
        const interval = setInterval(() => {
          if (currentStep < steps.length - 1) {
            currentStep++;
            setLoadingStatus(steps[currentStep]);
          }
        }, 2200);

        try {
          const formData = new FormData();
          formData.append("cv_file", file);
          if (url) formData.append("job_url", url);
          if (textFallback) formData.append("job_text_fallback", textFallback);

          const response = await fetch("/api/analyze", {
            method: "POST",
            body: formData,
          });

          clearInterval(interval);

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.detail || "Sunucuyla iletişim kurulurken bir hata oluştu.");
          }

          const data = await response.json();
          setResults(data);
          
          // Sonuçlara kaydır
          setTimeout(() => {
            document.getElementById('analyzer-section').scrollIntoView({ behavior: 'smooth' });
          }, 100);
        } catch (err) {
          clearInterval(interval);
          setError(err.message || "İşlem sırasında bilinmeyen bir hata meydana geldi.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="min-h-screen flex flex-col justify-between">
          
          {/* NAV BAR */}
          <nav className="bg-white/80 backdrop-blur-md border-b border-slate-100 py-4 px-6 sticky top-0 z-50 shadow-sm shrink-0">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2.5">
                <div className="p-2.5 bg-indigo-600 rounded-2xl text-white shadow-md shadow-indigo-600/20">
                  <IconFileText className="w-6 h-6 text-white" />
                </div>
                <div>
                  <h1 className="text-xl font-black text-slate-800 tracking-tight">CV Matcher</h1>
                  <p className="text-[10px] font-bold text-slate-450 uppercase tracking-widest -mt-0.5">AI Engine</p>
                </div>
              </div>
              <div className="hidden md:flex items-center gap-8">
                <a href="#how-it-works" className="text-sm font-semibold text-slate-500 hover:text-indigo-600 transition-colors">Nasıl Çalışır?</a>
                <a href="#features" className="text-sm font-semibold text-slate-500 hover:text-indigo-600 transition-colors">Özellikler</a>
                <a href="#faq" className="text-sm font-semibold text-slate-500 hover:text-indigo-600 transition-colors">S.S.S.</a>
              </div>
              <a href="#analyzer-section" className="py-2.5 px-5 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-sm font-bold shadow-md shadow-indigo-600/10 hover:shadow-indigo-600/20 transition-all transform active:scale-95">
                Analizi Başlat
              </a>
            </div>
          </nav>

          {/* HERO SECTION */}
          <header className="relative py-20 px-6 overflow-hidden">
            <div className="max-w-5xl mx-auto text-center relative z-10">
              <span className="px-4 py-2 bg-indigo-50 text-indigo-700 rounded-full text-xs font-extrabold border border-indigo-100 uppercase tracking-wider">
                Yapay Zeka Destekli Kariyer Danışmanı
              </span>
              <h1 className="text-4xl md:text-6xl font-black text-slate-800 tracking-tight mt-6 leading-tight max-w-4xl mx-auto">
                CV'nizi Hedef İlanla <span className="text-indigo-600">Saniyeler İçinde</span> Test Edin ve Optimize Edin.
              </h1>
              <p className="text-lg text-slate-555 mt-6 max-w-2xl mx-auto leading-relaxed">
                CV Matcher, yapay zekanın gücünü kullanarak özgeçmişiniz ile iş ilanı arasındaki uyuşmazlıkları analiz eder, CV'nizi güçlendirmeniz için nokta atışı tavsiyeler verir.
              </p>
              <div className="mt-10 flex flex-col sm:flex-row justify-center items-center gap-4">
                <a href="#analyzer-section" className="w-full sm:w-auto py-4 px-8 bg-indigo-600 hover:bg-indigo-700 text-white rounded-2xl text-md font-bold shadow-lg shadow-indigo-600/20 hover:shadow-indigo-600/30 transition-all transform active:scale-98">
                  CV'nizi Test Edin (Ücretsiz)
                </a>
                <a href="#how-it-works" className="w-full sm:w-auto py-4 px-8 bg-white border border-slate-200 hover:border-slate-350 text-slate-700 rounded-2xl text-md font-semibold transition-all">
                  Nasıl Çalışır?
                </a>
              </div>
            </div>
          </header>

          {/* MOCKUP PREVIEW */}
          <section className="px-6 pb-20">
            <div className="max-w-4xl mx-auto bg-white p-4 rounded-3xl shadow-2xl border border-slate-100 transform rotate-1 hover:rotate-0 transition-transform duration-500">
              <div className="bg-slate-900 rounded-2xl p-6 text-white flex flex-col md:flex-row items-center gap-6 justify-between">
                <div className="flex items-center gap-4">
                  <div className="p-3 bg-emerald-500/20 text-emerald-400 rounded-2xl text-2xl font-black">
                    %94
                  </div>
                  <div>
                    <h4 className="font-bold text-lg">Yazılım Mühendisi İlanı Eşleşmesi</h4>
                    <p className="text-xs text-slate-400">CV_Murat_Demir.pdf ile eşleşen güçlü yönler analiz edildi.</p>
                  </div>
                </div>
                <div className="flex gap-2">
                  <span className="px-3 py-1 bg-slate-800 rounded-full text-xs font-semibold text-slate-300">#Python</span>
                  <span className="px-3 py-1 bg-slate-800 rounded-full text-xs font-semibold text-slate-300">#FastAPI</span>
                  <span className="px-3 py-1 bg-slate-800 rounded-full text-xs font-semibold text-slate-300">#SQL</span>
                </div>
              </div>
            </div>
          </section>

          {/* STEPS SECTION */}
          <section id="how-it-works" className="py-20 bg-white border-y border-slate-100 px-6">
            <div className="max-w-6xl mx-auto">
              <div className="text-center max-w-2xl mx-auto">
                <h2 className="text-3xl font-extrabold text-slate-800 tracking-tight">3 Adımda Kolayca Analiz Edin</h2>
                <p className="text-sm text-slate-500 mt-2">Kariyerinizdeki bir sonraki adıma hazırlanmak işte bu kadar basit.</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mt-12">
                <div className="bg-slate-50/50 p-8 rounded-3xl border border-slate-100 hover:border-indigo-100 transition-all text-center">
                  <div className="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center font-bold text-xl mx-auto mb-4">1</div>
                  <h3 className="font-bold text-slate-800">CV'nizi Yükleyin</h3>
                  <p className="text-sm text-slate-500 mt-2">Güncel özgeçmişinizi PDF formatında sürükleyip bırakın.</p>
                </div>
                <div className="bg-slate-50/50 p-8 rounded-3xl border border-slate-100 hover:border-indigo-100 transition-all text-center">
                  <div className="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center font-bold text-xl mx-auto mb-4">2</div>
                  <h3 className="font-bold text-slate-800">İlan Bilgilerini Girin</h3>
                  <p className="text-sm text-slate-500 mt-2">Başvuracağınız ilanın linkini yapıştırın veya iş tanımını kopyalayın.</p>
                </div>
                <div className="bg-slate-50/50 p-8 rounded-3xl border border-slate-100 hover:border-indigo-100 transition-all text-center">
                  <div className="w-12 h-12 bg-indigo-100 text-indigo-600 rounded-2xl flex items-center justify-center font-bold text-xl mx-auto mb-4">3</div>
                  <h3 className="font-bold text-slate-800">Raporunuzu Alın</h3>
                  <p className="text-sm text-slate-500 mt-2">Uygunluk skoru, güçlü/zayıf yönler ve yapay zeka tavsiyelerini inceleyin.</p>
                </div>
              </div>
            </div>
          </section>

          {/* FEATURES SECTION */}
          <section id="features" className="py-20 px-6">
            <div className="max-w-6xl mx-auto">
              <div className="text-center max-w-2xl mx-auto">
                <h2 className="text-3xl font-extrabold text-slate-800 tracking-tight">Akıllı Özellikler</h2>
                <p className="text-sm text-slate-500 mt-2">CV Matcher, standart bir anahtar kelime eşleştiriciden çok daha fazlasını sunar.</p>
              </div>
              <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mt-12">
                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="p-3 bg-indigo-50 rounded-2xl w-fit text-indigo-600 mb-4"><IconInfo /></div>
                    <h4 className="font-bold text-slate-800">Doğru Skorlama</h4>
                    <p className="text-xs text-slate-500 mt-2">Deneyim yılı, diller ve teknik bilgilerinize göre gerçekçi bir uyum oranı hesaplar.</p>
                  </div>
                </div>
                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="p-3 bg-emerald-50 rounded-2xl w-fit text-emerald-600 mb-4"><IconCheckCircle /></div>
                    <h4 className="font-bold text-slate-800">Güçlü & Zayıf Ayrımı</h4>
                    <p className="text-xs text-slate-500 mt-2">İlanın gereksinimlerinden hangilerini karşıladığınızı ve hangilerini atladığınızı gösterir.</p>
                  </div>
                </div>
                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="p-3 bg-amber-50 rounded-2xl w-fit text-amber-500 mb-4"><IconLightbulb /></div>
                    <h4 className="font-bold text-slate-800">Geliştirme Önerileri</h4>
                    <p className="text-xs text-slate-500 mt-2">İlana uygun kabul alma ihtimalinizi artıracak eyleme dökülebilir CV güncellemeleri önerir.</p>
                  </div>
                </div>
                <div className="bg-white p-6 rounded-3xl border border-slate-100 shadow-sm flex flex-col justify-between">
                  <div>
                    <div className="p-3 bg-blue-50 rounded-2xl w-fit text-blue-600 mb-4"><IconHelpCircle /></div>
                    <h4 className="font-bold text-slate-800">Mülakat Hazırlığı</h4>
                    <p className="text-xs text-slate-500 mt-2">İlan ve özgeçmişiniz özelinde karşılaşabileceğiniz 3-4 kritik mülakat sorusunu hazırlar.</p>
                  </div>
                </div>
              </div>
            </div>
          </section>

          {/* ANALYZER TOOL SECTION */}
          <section id="analyzer-section" className="py-20 bg-slate-100/50 border-t border-slate-200/50 px-6">
            <div className="max-w-7xl mx-auto">
              <div className="text-center max-w-2xl mx-auto mb-12">
                <span className="px-3 py-1.5 bg-indigo-100 text-indigo-800 rounded-full text-xs font-bold border border-indigo-200">
                  CV MATCH ENGINE
                </span>
                <h2 className="text-3xl font-extrabold text-slate-800 mt-4 tracking-tight">Eşleştiriciyi Hemen Kullanın</h2>
                <p className="text-sm text-slate-500 mt-2">CV'nizi ve iş ilanını yükleyin, analiz sonuçları saniyeler içinde hazırlansın.</p>
              </div>

              <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                {/* Left side */}
                <div className="lg:col-span-5 space-y-6">
                  {error && (
                    <div className="p-4 bg-rose-50 border border-rose-100 text-rose-700 rounded-2xl flex items-start gap-3 text-sm animate-fadeIn shadow-sm">
                      <IconAlertCircle />
                      <div>
                        <p className="font-bold">Analiz sırasında hata oluştu</p>
                        <p className="mt-0.5 text-xs font-semibold">{error}</p>
                      </div>
                    </div>
                  )}

                  <CVUpload file={file} setFile={setFile} />
                  
                  <JobInput
                    url={url}
                    setUrl={setUrl}
                    textFallback={textFallback}
                    setTextFallback={setTextFallback}
                  />

                  <button
                    onClick={handleAnalyze}
                    disabled={loading}
                    className={`w-full py-4 px-6 font-bold text-white bg-indigo-600 hover:bg-indigo-700 rounded-2xl shadow-lg shadow-indigo-600/10 hover:shadow-indigo-600/20 active:scale-[0.99] transition-all flex items-center justify-center gap-2.5 ${
                      loading ? 'opacity-50 cursor-not-allowed' : ''
                    }`}
                  >
                    <IconPlay />
                    Eşleşmeyi Analiz Et
                  </button>
                </div>

                {/* Right side */}
                <div className="lg:col-span-7 self-stretch min-h-[450px]">
                  {loading ? (
                    <LoadingSpinner status={loadingStatus} />
                  ) : results ? (
                    <AnalysisResults results={results} />
                  ) : (
                    <div className="flex flex-col items-center justify-center p-12 text-center bg-white rounded-3xl border border-slate-100 shadow-md h-full min-h-[450px]">
                      <div className="p-4 bg-slate-50 border border-slate-100 rounded-full text-slate-400 mb-4 shadow-inner">
                        <IconFileText className="w-12 h-12 text-slate-400" />
                      </div>
                      <h3 className="text-md font-bold text-slate-700">Analiz Raporu Hazır Değil</h3>
                      <p className="mt-2 text-sm text-slate-400 max-w-sm leading-relaxed">
                        Öncelikle sol taraftan PDF formatındaki CV dosyanızı yükleyin ve iş ilanı detaylarını ekleyin. Ardından "Eşleşmeyi Analiz Et" butonuna basın.
                      </p>
                    </div>
                  )}
                </div>
              </div>
            </div>
          </section>

          {/* FAQ SECTION */}
          <section id="faq" className="py-20 bg-white border-t border-slate-100 px-6">
            <div className="max-w-4xl mx-auto">
              <div className="text-center max-w-2xl mx-auto mb-12">
                <h2 className="text-3xl font-extrabold text-slate-800 tracking-tight">Sıkça Sorulan Sorular</h2>
                <p className="text-sm text-slate-500 mt-2">Uygulamamız ve yapay zeka entegrasyonumuzla ilgili aklınıza takılabilecek detaylar.</p>
              </div>
              <div className="space-y-4">
                <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                  <h4 className="font-bold text-slate-800">Verilerim ve CV'm güvende mi?</h4>
                  <p className="text-sm text-slate-500 mt-2">Yüklediğiniz CV dosyaları ve girdiğiniz ilanlar hiçbir veritabanında saklanmaz. Dosyalar geçici hafızada işlenerek doğrudan Gemini API'ye analiz için gönderilir ve işlem sonrasında tamamen bellekten silinir.</p>
                </div>
                <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                  <h4 className="font-bold text-slate-800">Desteklenen dosya formatları nelerdir?</h4>
                  <p className="text-sm text-slate-500 mt-2">Yapay zekanın özgeçmişinizi en hatasız şekilde okuyabilmesi adına şu an için yalnızca PDF (.pdf) formatını destekliyoruz. Word (.docx) dosyalarınızı PDF'e dönüştürerek yükleyebilirsiniz.</p>
                </div>
                <div className="bg-slate-50 p-6 rounded-2xl border border-slate-100">
                  <h4 className="font-bold text-slate-800">İlan linkinden veri çekilemezse ne yapmalıyım?</h4>
                  <p className="text-sm text-slate-500 mt-2">LinkedIn gibi bazı büyük kariyer siteleri bot koruması (Cloudflare/CAPTCHA) kullanmaktadır. Bu sitelerin linkinden veri çekilemezse, ilan giriş alanındaki 'İlan Metnini Manuel Yapıştır' seçeneğini açıp ilan açıklamasını kopyalayıp yapıştırarak analizi anında tamamlayabilirsiniz.</p>
                </div>
              </div>
            </div>
          </section>

          {/* FOOTER */}
          <footer className="bg-slate-900 border-t border-slate-800 text-white py-12 px-6 shrink-0">
            <div className="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-6">
              <div className="flex items-center gap-2.5">

                  <IconFileText className="w-5 h-5 text-white" />
                </div>
                <div>

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
