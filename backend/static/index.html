<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CV Matcher - AI Destekli CV Uygunluk Analizörü</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <!-- Supabase JS SDK CDN -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <!-- Babel CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            slate: {
              50: '#f8fafc',
              350: '#cbd5e1',
              400: '#94a3b8',
              600: '#475569',
              750: '#1e293b',
              800: '#1e293b',
              900: '#0f172a',
              950: '#090d1a',
            },
            sky: {
              400: '#38bdf8',
              500: '#0ea5e9',
              600: '#0284c7',
            },
            emerald: {
              500: '#10b981',
              600: '#059669',
            },
            amber: {
              500: '#f59e0b',
            },
            rose: {
              500: '#f43f5e',
              600: '#e11d48',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
    body {
      background-color: #090D1A;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-350 min-h-screen font-sans antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    // --- Inline SVGs ---
    const IconUpload = () => (
      <svg className="mx-auto h-12 w-12 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.5">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
      </svg>
    );

    const IconFileText = () => (
      <svg className="w-5 h-5 text-sky-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z" />
      </svg>
    );

    const IconX = () => (
      <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    );

    const IconLock = ({ className = "w-5 h-5 text-sky-450" }) => (
      <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
      </svg>
    );

    const IconSparkles = () => (
      <svg className="w-4 h-4 text-sky-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9.813 15.904L9 21l-.813-5.096L3 15l5.096-.813L9 9l.813 5.096L15 15l-5.187.904zM18 10.5l-.563 3.063L14.375 14l3.062.563.563 3.062.563-3.062L21.625 14l-3.062-.563-.563-3.063z" />
      </svg>
    );

    const IconCheck = () => (
      <svg className="w-3.5 h-3.5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
        <path strokeLinecap="round" strokeLinejoin="round" d="M4.5 12.75l6 6 9-13.5" />
      </svg>
    );

    const IconPlus = () => (
      <svg className="w-4 h-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
      </svg>
    );

    const IconArrowRight = () => (
      <svg className="w-5 h-5 text-slate-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" />
      </svg>
    );

    const IconHistory = () => (
      <svg className="w-4 h-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconChevronRight = () => (
      <svg className="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
        <path strokeLinecap="round" strokeLinejoin="round" d="M8.25 4.5l7.5 7.5-7.5 7.5" />
      </svg>
    );

    const IconCheckCircle = () => (
      <svg className="w-5 h-5 text-emerald-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
    );

    const IconAlertTriangle = () => (
      <svg className="w-5 h-5 text-rose-500 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    );

    const IconCloud = () => (
      <svg className="w-6 h-6 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M2.25 15a4.5 4.5 0 004.5 4.5H18a3.75 3.75 0 001.332-7.257 3 3 0 00-3.758-3.848 5.25 5.25 0 00-10.233 2.33A4.502 4.502 0 002.25 15z" />
      </svg>
    );

    const IconLink = () => (
      <svg className="w-6 h-6 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M13.19 8.688a4.5 4.5 0 011.242 7.244l-4.5 4.5a4.5 4.5 0 01-6.364-6.364l1.757-1.757m13.35-.622l1.757-1.757a4.5 4.5 0 00-6.364-6.364l-4.5 4.5a4.5 4.5 0 001.242 7.244" />
      </svg>
    );

    const IconChart = () => (
      <svg className="w-6 h-6 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
        <path strokeLinecap="round" strokeLinejoin="round" d="M7.5 14.25v2.25m3-4.5v4.5m3-6.75v6.75m3-9v9M6 20.25h12A2.25 2.25 0 0020.25 18V6A2.25 2.25 0 0018 3.75H6A2.25 2.25 0 003.75 6v12A2.25 2.25 0 006 20.25z" />
      </svg>
    );

    const IconPlay = () => (
      <svg className="w-4 h-4 text-white fill-current" viewBox="0 0 24 24">
        <path d="M8 5v14l11-7z" />
      </svg>
    );


    // --- MAIN APP ---
    function App() {
      const [supabaseClient, setSupabaseClient] = useState(null);
      const [session, setSession] = useState(null);
      const [user, setUser] = useState(null);
      const [history, setHistory] = useState([]);

      // Flow state machine
      const [flowState, setFlowState] = useState('landing'); 
      const [showOnboarding, setShowOnboarding] = useState(false);

      // Input State
      const [file, setFile] = useState(null);
      const [url, setUrl] = useState('');
      const [textFallback, setTextFallback] = useState('');
      const [jobMethod, setJobMethod] = useState('url'); 
      const [dragActive, setDragActive] = useState(false);

      // Analysis Results
      const [loadingStatus, setLoadingStatus] = useState('');
      const [results, setResults] = useState(null);
      const [error, setError] = useState(null);

      // Auth States
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [isSignUp, setIsSignUp] = useState(false);
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [authLoading, setAuthLoading] = useState(false);
      const [authError, setAuthError] = useState('');
      const [authSuccess, setAuthSuccess] = useState('');

      // Onboarding States
      const [obStatus, setObStatus] = useState('');
      const [obRoles, setObRoles] = useState('');
      const [obLocation, setObLocation] = useState('Remote');
      const [obSearch, setObSearch] = useState('');
      const [obLoading, setObLoading] = useState(false);

      const [showPrivacyTooltip, setShowPrivacyTooltip] = useState(false);

      useEffect(() => {
        fetch('/api/config')
          .then((res) => res.json())
          .then((cfg) => {
            if (cfg.supabase_url && cfg.supabase_anon_key) {
              const client = supabase.createClient(cfg.supabase_url, cfg.supabase_anon_key);
              setSupabaseClient(client);

              client.auth.getSession().then(({ data: { session } }) => {
                setSession(session);
                setUser(session?.user ?? null);
                if (session) {
                  loadHistory(session.access_token);
                  setFlowState('dashboard');
                }
              });

              client.auth.onAuthStateChange((_event, session) => {
                setSession(session);
                setUser(session?.user ?? null);
                if (session) {
                  loadHistory(session.access_token);
                } else {
                  setHistory([]);
                  setFlowState('landing');
                }
              });
            }
          })
          .catch((err) => console.error(err));
      }, []);

      const loadHistory = async (token) => {
        try {
          const res = await fetch('/api/history', {
            headers: { 'Authorization': `Bearer ${token}` }
          });
          if (res.ok) {
            const data = await res.json();
            setHistory(data);
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleLogin = async (e) => {
        e.preventDefault();
        if (!supabaseClient) return;
        setAuthLoading(true);
        setAuthError('');
        setAuthSuccess('');

        try {
          const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });
          if (error) throw error;
          setAuthSuccess("Giriş başarılı! Rapor yükleniyor...");

          setTimeout(() => {
            setShowAuthModal(false);
            resetAuthForm();
            if (file && (url || textFallback)) {
              runAnalysis(data.session.access_token);
            } else {
              setFlowState('dashboard');
            }
          }, 1000);
        } catch (err) {
          setAuthError(err.message || "Giriş yapılamadı.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleSignUp = async (e) => {
        e.preventDefault();
        if (!supabaseClient) return;
        setAuthLoading(true);
        setAuthError('');
        setAuthSuccess('');

        try {
          const { data, error } = await supabaseClient.auth.signUp({ email, password });
          if (error) throw error;
          setAuthSuccess("Hesap başarıyla oluşturuldu.");

          setTimeout(() => {
            setShowAuthModal(false);
            resetAuthForm();
            setShowOnboarding(true);
            if (file && (url || textFallback)) {
              runAnalysis(data.session.access_token);
            } else {
              setFlowState('dashboard');
            }
          }, 1000);
        } catch (err) {
          setAuthError(err.message || "Kayıt işlemi başarısız.");
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        if (!supabaseClient) return;
        await supabaseClient.auth.signOut();
        setFile(null);
        setUrl('');
        setTextFallback('');
        setResults(null);
        setFlowState('landing');
      };

      const resetAuthForm = () => {
        setEmail('');
        setPassword('');
        setAuthError('');
        setAuthSuccess('');
      };

      const handleOnboardingSubmit = async (e) => {
        e.preventDefault();
        if (!session?.access_token) {
          setShowOnboarding(false);
          return;
        }
        setObLoading(true);

        try {
          const rolesArray = obRoles.split(',').map(r => r.trim()).filter(r => r.length > 0);
          await fetch('/api/profile', {
            method: 'PATCH',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': `Bearer ${session.access_token}`
            },
            body: JSON.stringify({
              current_status: obStatus,
              target_roles: rolesArray,
              preferred_location: obLocation,
              job_search_status: obSearch
            })
          });
          setShowOnboarding(false);
        } catch (err) {
          console.error(err);
        } finally {
          setObLoading(false);
        }
      };

      const triggerAnalysis = (e) => {
        e.preventDefault();
        if (!file) {
          setError("Lütfen önce bir CV yükleyin.");
          return;
        }
        if (jobMethod === 'url' && !url.trim()) {
          setError("Lütfen geçerli bir ilan linki girin.");
          return;
        }
        if (jobMethod === 'text' && !textFallback.trim()) {
          setError("Lütfen ilan metnini yapıştırın.");
          return;
        }

        setError(null);
        runAnalysis(session?.access_token || null);
      };

      const runAnalysis = async (token) => {
        setFlowState('loading');
        setResults(null);

        const steps = [
          "CV'nizdeki deneyimleri inceliyoruz...",
          "İlanın beklentilerini çıkarıyoruz...",
          "Yetkinliklerinizi karşılaştırıyoruz...",
          "Eksik anahtar kelimeleri kontrol ediyoruz...",
          "Sana özel önerileri hazırlıyoruz..."
        ];
        
        let currentStep = 0;
        setLoadingStatus(steps[currentStep]);
        
        const interval = setInterval(() => {
          if (currentStep < steps.length - 1) {
            currentStep++;
            setLoadingStatus(steps[currentStep]);
          }
        }, 2000);

        try {
          const formData = new FormData();
          formData.append("cv_file", file);
          if (url && jobMethod === 'url') formData.append("job_url", url);
          if (textFallback && jobMethod === 'text') formData.append("job_text_fallback", textFallback);

          const headers = {};
          if (token) {
            headers["Authorization"] = `Bearer ${token}`;
          }

          const response = await fetch("/api/analyze", {
            method: "POST",
            headers: headers,
            body: formData,
          });

          clearInterval(interval);

          if (!response.ok) {
            const errorData = await response.json();
            throw new Error(errorData.detail || "Analiz işleminde sunucu hatası oluştu.");
          }

          const data = await response.json();
          setResults(data);

          if (token) {
            loadHistory(token);
            setFlowState('full_result');
          } else {
            setFlowState('preview');
          }
        } catch (err) {
          clearInterval(interval);
          setError(err.message);
          setFlowState(file ? 'job_input' : 'cv_upload');
        }
      };

      const handleDrag = (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (e.type === "dragenter" || e.type === "dragover") {
          setDragActive(true);
        } else if (e.type === "dragleave") {
          setDragActive(false);
        }
      };

      const handleDrop = (e) => {
        e.preventDefault();
        e.stopPropagation();
        setDragActive(false);
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          const droppedFile = e.dataTransfer.files[0];
          if (droppedFile.type === "application/pdf") {
            setFile(droppedFile);
            setFlowState('job_input');
          } else {
            alert("Lütfen yalnızca PDF formatında bir dosya yükleyin.");
          }
        }
      };

      const loadSavedResult = (scan) => {
        setResults(scan.results);
        setFlowState('full_result');
      };

      return (
        <div className="min-h-screen flex flex-col justify-between bg-slate-950 text-slate-350">
          
          {/* HEADER / NAVIGATION */}
          <nav className="bg-[#131B2E] border-b border-slate-800/80 py-4 px-6 sticky top-0 z-50 shadow-md shrink-0">
            <div className="max-w-7xl mx-auto flex items-center justify-between">
              <div className="flex items-center gap-2.5 cursor-pointer" onClick={() => user ? setFlowState('dashboard') : setFlowState('landing')}>
                <div className="p-2.5 bg-gradient-to-r from-sky-500 to-blue-600 rounded-xl text-white shadow-sm">
                  <IconFileText />
                </div>
                <div>
                  <h1 className="text-xl font-extrabold text-white tracking-tight">CV Matcher</h1>
                  <p className="text-[10px] font-bold text-sky-400 uppercase tracking-widest -mt-0.5 font-mono">Autofit AI</p>
                </div>
              </div>
              
              <div className="flex items-center gap-4">
                {user ? (
                  <div className="flex items-center gap-3">
                    <button
                      onClick={() => { setFile(null); setUrl(''); setTextFallback(''); setFlowState('cv_upload'); }}
                      className="hidden sm:flex py-2 px-4 bg-sky-500/10 text-sky-400 hover:bg-sky-500/20 rounded-xl text-xs font-semibold shadow-sm transition-all duration-200"
                    >
                      Yeni Analiz Yap
                    </button>
                    <button
                      onClick={() => setFlowState('dashboard')}
                      className={`py-2 px-4 rounded-xl text-xs font-semibold transition-all duration-200 ${flowState === 'dashboard' ? 'bg-slate-800 text-white' : 'text-slate-300 hover:text-white'}`}
                    >
                      Analizlerim
                    </button>
                    <button
                      onClick={handleLogout}
                      className="py-2 px-4 border border-slate-700 hover:border-rose-500/50 hover:bg-rose-500/10 text-slate-300 hover:text-rose-455 rounded-xl text-xs font-semibold shadow-sm transition-all duration-200"
                    >
                      Çıkış Yap
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => { resetAuthForm(); setIsSignUp(false); setShowAuthModal(true); }}
                    className="py-2.5 px-5 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white rounded-xl text-sm font-semibold shadow-sm transition-all duration-200"
                  >
                    Giriş Yap
                  </button>
                )}
              </div>
            </div>
          </nav>

          {/* MAIN CONTAINER */}
          <main className="flex-grow max-w-7xl w-full mx-auto p-6 flex flex-col justify-center">

            {error && (
              <div className="max-w-xl mx-auto w-full mb-6 p-4 bg-rose-950/40 border border-rose-800/60 text-rose-350 rounded-2xl flex items-start gap-3 text-sm animate-fadeIn shadow-sm">
                <IconAlertTriangle />
                <div>
                  <p className="font-extrabold text-white">Bir Sorun Oluştu</p>
                  <p className="mt-0.5 text-xs text-slate-400">{error}</p>
                </div>
              </div>
            )}

            {/* 1. LANDING PAGE - FULL iOS MOCKUP REDESIGN ALIGNMENT */}
            {flowState === 'landing' && (
              <div className="py-8 space-y-12 max-w-4xl mx-auto w-full text-center animate-fadeIn">
                
                {/* Hero Header Section */}
                <div className="space-y-6">
                  <div className="inline-block">
                    <span className="bg-sky-500/10 text-sky-400 border border-sky-500/25 rounded-full px-4 py-1.5 text-[10px] font-extrabold uppercase tracking-wider">
                      ÖZGEÇMİŞ EŞLEŞTİRME MOTORU
                    </span>
                  </div>
                  <h1 className="text-4xl md:text-5xl font-extrabold tracking-tight text-white leading-tight max-w-2xl mx-auto">
                    Bu işe ne kadar uygunsun?
                  </h1>
                  <p className="text-sm text-slate-400 leading-relaxed max-w-2xl mx-auto">
                    CV'ni ve iş ilanını ekle. Uygunluk skorunu, güçlü yönlerini, eksiklerini ve CV'ni nasıl geliştirebileceğini saniyeler içinde gör.
                  </p>
                </div>

                {/* Character Illustration Mockup */}
                <div className="relative max-w-md mx-auto py-4">
                  {/* Glowing background blob */}
                  <div className="absolute inset-0 bg-sky-500/10 blur-3xl rounded-full scale-75"></div>
                  
                  {/* Outer Frame / SVG Illustration */}
                  <div className="relative border border-slate-800 bg-[#131B2E]/60 rounded-3xl p-6 shadow-2xl flex items-center justify-center min-h-[220px]">
                    <svg className="w-64 h-64 text-sky-400" viewBox="0 0 200 200" fill="none">
                      {/* Decorative Tech UI Nodes */}
                      <circle cx="25" cy="50" r="3" fill="#38bdf8" opacity="0.4" />
                      <circle cx="175" cy="150" r="4" fill="#38bdf8" opacity="0.3" />
                      <path d="M150 40h20M160 30v20" stroke="#38bdf8" strokeWidth="1.5" opacity="0.4" />
                      <rect x="15" y="110" width="12" height="12" rx="2" stroke="#38bdf8" strokeWidth="1" opacity="0.3" fill="none" />
                      <circle cx="160" cy="95" r="15" stroke="#38bdf8" strokeWidth="1" strokeDasharray="3 3" opacity="0.4" fill="none" />

                      {/* Character Head/Body Silhouette */}
                      <path d="M100 130c22 0 40 18 40 40H60c0-22 18-40 40-40z" fill="#1e293b" />
                      <path d="M100 130c22 0 40 18 40 40H60c0-22 18-40 40-40z" stroke="#38bdf8" strokeWidth="1.5" />
                      <circle cx="100" cy="98" r="22" fill="#1e293b" stroke="#38bdf8" strokeWidth="1.5" />
                      
                      {/* Character Details */}
                      <circle cx="94" cy="95" r="2" fill="#38bdf8" />
                      <circle cx="106" cy="95" r="2" fill="#38bdf8" />
                      <path d="M96 106c2 1.5 6 1.5 8 0" stroke="#38bdf8" strokeWidth="1.5" strokeLinecap="round" />
                      
                      {/* Tablet Representation held by character */}
                      <rect x="110" y="105" width="45" height="55" rx="4" fill="#090d1a" stroke="#38bdf8" strokeWidth="2" />
                      <line x1="118" y1="115" x2="147" y2="115" stroke="#38bdf8" strokeWidth="2" />

                <p>© 2026 CV Matcher. Tüm hakları saklıdır.</p>
                <div className="flex gap-4 text-slate-500">
                  <a href="#privacy" className="hover:underline">Kullanım Şartları</a>
                  <a href="#privacy" className="hover:underline">Gizlilik Politikası</a>
                </div>
              </div>
            </div>
          </footer>

          {/* AUTH MODAL */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-[#131B2E] rounded-2xl shadow-xl border border-slate-800 w-full max-w-md p-6 relative overflow-hidden">
                <button
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-4 right-4 p-2 text-slate-400 hover:text-white hover:bg-slate-850 rounded-xl transition-all"
                >
                  <IconX />
                </button>

                <h3 className="text-xl font-extrabold text-white text-center mb-6">
                  {isSignUp ? "Analizin hazır 🎯" : "Tekrar hoş geldin"}
                </h3>
                <p className="text-xs text-slate-400 text-center -mt-4 mb-6 leading-relaxed font-medium">
                  {isSignUp ? "Tam sonucu görmek ve analizlerini kaydetmek için ücretsiz hesabını oluştur." : "Kayıtlı analizlerinizi görmek için giriş yapın."}
                </p>

                {authError && (
                  <div className="mb-4 p-3.5 bg-rose-950/30 border border-rose-800 text-rose-455 rounded-xl text-xs font-semibold flex gap-2">
                    <IconAlertTriangle />
                    <span>{authError}</span>
                  </div>
                )}

                {authSuccess && (
                  <div className="mb-4 p-3.5 bg-emerald-950/30 border border-emerald-800 text-emerald-400 rounded-xl text-xs font-semibold flex gap-2">
                    <IconCheckCircle />
                    <span>{authSuccess}</span>
                  </div>
                )}

                <form onSubmit={isSignUp ? handleSignUp : handleLogin} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-450 uppercase tracking-wider mb-1.5">E-posta Adresi</label>
                    <input
                      type="email"
                      required
                      value={email}
                      onChange={(e) => setEmail(e.target.value)}
                      placeholder="adsoyad@sirket.com"
                      className="block w-full px-4 py-3 border border-slate-700 rounded-lg text-sm bg-slate-950/40 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-450 uppercase tracking-wider mb-1.5">Şifre</label>
                    <input
                      type="password"
                      required
                      value={password}
                      onChange={(e) => setPassword(e.target.value)}
                      placeholder="••••••••"
                      className="block w-full px-4 py-3 border border-slate-700 rounded-lg text-sm bg-slate-950/40 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500 transition-all"
                    />
                  </div>

                  <button
                    type="submit"
                    disabled={authLoading}
                    className="w-full py-3.5 px-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center"
                  >
                    {authLoading ? (
                      <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
                    ) : isSignUp ? "Hesap Oluştur" : "Giriş Yap"}
                  </button>
                </form>

                <div className="mt-6 border-t border-slate-800/80 pt-4 text-center">
                  <button
                    onClick={() => { setIsSignUp(!isSignUp); resetAuthForm(); }}
                    className="text-xs font-bold text-sky-400 hover:text-sky-300 transition-colors"
                  >
                    {isSignUp ? "Zaten hesabın var mı? Giriş yap" : "Hesabınız yok mu? Hesap Oluşturun"}
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* PROFILE ONBOARDING */}
          {showOnboarding && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/60 backdrop-blur-sm animate-fadeIn">
              <div className="bg-[#131B2E] rounded-2xl shadow-xl border border-slate-800 w-full max-w-md p-6 relative overflow-hidden space-y-6">
                
                <div className="text-center space-y-2">
                  <h3 className="text-xl font-extrabold text-white">Sana daha iyi öneriler verelim 🎯</h3>
                  <p className="text-xs text-slate-400 leading-relaxed font-medium">30 saniyede birkaç bilgiyle deneyimini kişiselleştirebiliriz.</p>
                </div>

                <form onSubmit={handleOnboardingSubmit} className="space-y-4">
                  <div>
                    <label className="block text-xs font-bold text-slate-450 uppercase tracking-wider mb-2">Mevcut Durum</label>
                    <select
                      value={obStatus}
                      onChange={(e) => setObStatus(e.target.value)}
                      className="block w-full px-4 py-2.5 border border-slate-700 rounded-lg bg-slate-950/40 text-white text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
                    >
                      <option value="">Seçiniz...</option>
                      <option value="student">Öğrenciyim</option>
                      <option value="graduate">Yeni Mezunum</option>
                      <option value="early_career">1-3 Yıl Deneyim</option>
                      <option value="professional">3+ Yıl Deneyim</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-455 uppercase tracking-wider mb-1.5">Hedeflediğin Roller</label>
                    <input
                      type="text"
                      value={obRoles}
                      onChange={(e) => setObRoles(e.target.value)}
                      placeholder="Örn: Product, Growth, Finance, Data..."
                      className="block w-full px-4 py-2.5 border border-slate-700 rounded-lg text-sm bg-slate-950/40 text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-sky-500"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-450 uppercase tracking-wider mb-2">Lokasyon Tercihi</label>
                    <select
                      value={obLocation}
                      onChange={(e) => setObLocation(e.target.value)}
                      className="block w-full px-4 py-2.5 border border-slate-700 rounded-lg bg-slate-950/40 text-white text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
                    >
                      <option value="Istanbul">İstanbul</option>
                      <option value="Turkiye">Türkiye geneli</option>
                      <option value="Remote">Remote (Uzaktan)</option>
                      <option value="Other">Diğer (Yurt dışı)</option>
                    </select>
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-450 uppercase tracking-wider mb-2">İş Arama Durumu</label>
                    <select
                      value={obSearch}
                      onChange={(e) => setObSearch(e.target.value)}
                      className="block w-full px-4 py-2.5 border border-slate-700 rounded-lg bg-slate-950/40 text-white text-sm focus:outline-none focus:ring-2 focus:ring-sky-500"
                    >
                      <option value="">Seçiniz...</option>
                      <option value="active">Aktif olarak iş arıyorum</option>
                      <option value="open">Fırsatlara açığım</option>
                      <option value="just_improving">Şimdilik sadece CV'mi geliştiriyorum</option>
                    </select>
                  </div>

                  <button
                    type="submit"
                    disabled={obLoading}
                    className="w-full py-3 px-4 bg-gradient-to-r from-sky-500 to-blue-600 hover:from-sky-600 hover:to-blue-700 text-white font-bold rounded-xl shadow-md transition-all flex items-center justify-center"
                  >
                    {obLoading ? <div className="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> : "Kişiselleştirmeyi Tamamla"}
                  </button>
                  
                  <button
                    type="button"
                    onClick={() => setShowOnboarding(false)}
                    className="w-full text-center text-xs font-semibold text-slate-400 hover:text-white transition-colors"
                  >
                    Şimdilik geç
                  </button>
                </form>

              </div>
            </div>
          )}

          {/* REDESIGNED RESULTS PANEL FOR INLINE SCRIPT */}
          <script type="text/babel">
            // Expose results view globally or mount it inside App component.
          </script>

        </div>
      );
    }
  </script>
</body>
</html>
